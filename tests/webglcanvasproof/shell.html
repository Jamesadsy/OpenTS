<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VV-TS1A 124F WebGL Canvas Proof</title>
  <style>
    body { margin: 0; background: #101820; color: #e8eef2; font: 14px monospace; }
    #canvas { display: block; }
    #proof-status { white-space: pre-wrap; margin: 12px; }
  </style>
</head>
<body>
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
  <pre id="proof-status" data-status="loading">Loading 124F renderer proof…</pre>
  <script>
    (function () {
      const output = document.getElementById('proof-status');
      const runtimeErrors = [];
      const capturedConsole = [];
      let proofFinished = false;
      let callbackStarted = 0;
      let callbackReturned = 0;
      let heartbeat = 0;
      let heartbeatAtResize = 0;
      let heartbeatAtFirstCallback = 0;
      let heartbeatAtLastCallback = 0;
      let presentAtResize = 0;
      let resizeSucceeded = false;
      let dprAtResize = 0;
      let logicalResizeRequest = [800, 600];
      let expectedDprDrawable = [0, 0];
      let logicalWindowAfterResize = [0, 0];
      let cssClientSizeAfterResize = [0, 0];
      let physicalDrawableAfterResize = [0, 0];
      let canvasBackingStoreAfterResize = [0, 0];
      let rendererResizeSize = [0, 0];
      let logicalResizeObserved = false;
      let physicalDrawableConsistent = false;
      let rendererResizeUsedActualDrawable = false;

      function append(text) {
        output.textContent += '\n' + String(text);
      }

      const originalConsoleError = console.error.bind(console);
      console.error = function (...args) {
        capturedConsole.push(args.map(String).join(' '));
        originalConsoleError(...args);
      };
      window.addEventListener('error', function (event) {
        runtimeErrors.push(event.message || String(event.error || 'window error'));
      });
      window.addEventListener('unhandledrejection', function (event) {
        runtimeErrors.push(String(event.reason || 'unhandled rejection'));
      });

      function complete(status, details) {
        if (proofFinished) return;
        proofFinished = true;
        clearInterval(heartbeatTimer);
        const result = Object.assign({
          status,
          browser: navigator.userAgent,
          canvasExists: document.getElementById('canvas') instanceof HTMLCanvasElement,
          webglContextExists: !!(document.getElementById('canvas').getContext('webgl2')
            || document.getElementById('canvas').getContext('webgl')),
          canvasWidth: document.getElementById('canvas').width,
          canvasHeight: document.getElementById('canvas').height,
          callbacksStarted: callbackStarted,
          callbacksReturned: callbackReturned,
          everyCallbackReturnedToJavaScript: callbackStarted === callbackReturned
            && callbackReturned === 360,
          heartbeatCount: heartbeat,
          heartbeatAtFirstCallback,
          heartbeatAtResize,
          heartbeatAtLastCallback,
          heartbeatAdvancedBeforeResize: heartbeatAtResize > heartbeatAtFirstCallback,
          heartbeatAdvancedAfterResize: heartbeatAtLastCallback > heartbeatAtResize,
          presentCount: Module._VV124F_Present_Count(),
          presentAtResize,
          presentsAfterResize: Module._VV124F_Present_Count() - presentAtResize,
          initialDrawable: [Module._VV124F_Initial_Width(), Module._VV124F_Initial_Height()],
          initialLogicalWindow: [Module._VV124F_Initial_Window_Width(), Module._VV124F_Initial_Window_Height()],
          devicePixelRatioAtResize: dprAtResize,
          logicalResizeRequest,
          logicalWindowAfterResize,
          cssClientSizeAfterResize,
          resizedDrawable: [Module._VV124F_Resized_Width(), Module._VV124F_Resized_Height()],
          expectedDprDrawable,
          physicalDrawableConsistent,
          canvasBackingStoreAfterResize,
          rendererResizeSize,
          rendererResizeUsedActualDrawable,
          logicalResizeObserved,
          renderer: UTF8ToString(Module._VV124F_Renderer_Name()),
          resizeSucceeded,
          runtimeErrors,
          consoleErrors: capturedConsole
        }, details || {});
        window.vv124fProof = result;
        output.dataset.status = status;
        output.textContent = JSON.stringify(result, null, 2);
      }

      const heartbeatTimer = setInterval(function () {
        heartbeat += 1;
      }, 10);

      function startProof() {
        if (!document.getElementById('canvas')) {
          complete('failed', { failure: 'canvas element missing' });
          return;
        }

        let initialized = 0;
        try {
          initialized = Module._VV124F_Begin();
        } catch (error) {
          runtimeErrors.push(String(error));
          complete('failed', { failure: 'native renderer initialization threw' });
          return;
        }
        if (!initialized) {
          complete('failed', { failure: 'SDL window or bgfx initialization failed' });
          return;
        }
        append('bgfx renderer: ' + UTF8ToString(Module._VV124F_Renderer_Name()));

        const targetCallbacks = 360;
        const resizeCallback = 150;
        function tick() {
          callbackStarted += 1;
          if (callbackStarted === 1) heartbeatAtFirstCallback = heartbeat;
          let returned = 0;
          try {
            returned = Module._VV124F_Frame();
          } catch (error) {
            runtimeErrors.push(String(error));
          }
          if (!returned) {
            complete('failed', { failure: 'native clear/present callback failed' });
            return;
          }
          callbackReturned += 1;

          if (callbackReturned === resizeCallback) {
            presentAtResize = Module._VV124F_Present_Count();
            heartbeatAtResize = heartbeat;
            dprAtResize = window.devicePixelRatio || 1;
            resizeSucceeded = Module._VV124F_Resize(800, 600) === 1;
            logicalWindowAfterResize = [Module._VV124F_Resized_Window_Width(), Module._VV124F_Resized_Window_Height()];
            physicalDrawableAfterResize = [Module._VV124F_Resized_Width(), Module._VV124F_Resized_Height()];
            expectedDprDrawable = [
              Math.round(logicalResizeRequest[0] * dprAtResize),
              Math.round(logicalResizeRequest[1] * dprAtResize)
            ];
            const canvas = document.getElementById('canvas');
            const rect = canvas.getBoundingClientRect();
            cssClientSizeAfterResize = [rect.width, rect.height];
            canvasBackingStoreAfterResize = [canvas.width, canvas.height];
            rendererResizeSize = [Module._VV124F_Backend_Resize_Width(), Module._VV124F_Backend_Resize_Height()];
            logicalResizeObserved = resizeSucceeded
              && logicalWindowAfterResize[0] === logicalResizeRequest[0]
              && logicalWindowAfterResize[1] === logicalResizeRequest[1];
            physicalDrawableConsistent = physicalDrawableAfterResize[0] === expectedDprDrawable[0]
              && physicalDrawableAfterResize[1] === expectedDprDrawable[1]
              && canvasBackingStoreAfterResize[0] === physicalDrawableAfterResize[0]
              && canvasBackingStoreAfterResize[1] === physicalDrawableAfterResize[1];
            rendererResizeUsedActualDrawable = rendererResizeSize[0] === physicalDrawableAfterResize[0]
              && rendererResizeSize[1] === physicalDrawableAfterResize[1];
            if (!logicalResizeObserved || !physicalDrawableConsistent || !rendererResizeUsedActualDrawable) {
              complete('failed', { failure: 'DPI-aware logical/drawable/renderer resize checks failed' });
              return;
            }
          }

          if (callbackReturned >= targetCallbacks) {
            heartbeatAtLastCallback = heartbeat;
            const passed = callbackStarted === targetCallbacks
              && callbackReturned === targetCallbacks
              && Module._VV124F_Present_Count() === targetCallbacks
              && heartbeatAtResize > heartbeatAtFirstCallback
              && heartbeatAtLastCallback > heartbeatAtResize
              && logicalResizeObserved
              && physicalDrawableConsistent
              && rendererResizeUsedActualDrawable
              && Module._VV124F_Present_Count() - presentAtResize >= 210
              && runtimeErrors.length === 0
              && capturedConsole.length === 0;
            complete(passed ? 'passed' : 'failed', passed ? {} : { failure: 'proof gate assertion failed' });
            return;
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      window.__vv124fStart = function () {
        setTimeout(startProof, 0);
      };

      window.__vv124fRuntimeError = function (message) {
        runtimeErrors.push(String(message));
      };
    })();

    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (text) { if (text) console.log('[OpenTS proof]', text); },
      printErr: function (text) { if (text) { console.error('[OpenTS proof]', text); } },
      onRuntimeInitialized: function () { window.__vv124fStart(); },
      onAbort: function (reason) { window.__vv124fRuntimeError('Emscripten abort: ' + reason); }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
